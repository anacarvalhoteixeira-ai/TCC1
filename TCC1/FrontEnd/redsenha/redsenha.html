<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="redsenha.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Belanosima:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Redefinir Senha</title>
</head>
<body>


  <div class="bg"></div>


    <div class="container">


    <div class="logo">
     
      <img src="../img/NexusS.png" alt="Logo Nexus">


    </div>


    <h1>Redefinir Senha</h1>


    <p class="subtitulo">
      Digite sua nova senha para recuperar o acesso à sua conta.
    </p>


    <form>


      <div class="input-box">
        <label>Nova senha</label>
        <input type="password" placeholder="Digite sua nova senha">
      </div>


      <div class="input-box">
        <label>Confirmar senha</label>
        <input type="password" placeholder="Confirme sua senha">
      </div>


      <button class="btn">
        Redefinir senha
      </button>


    </form>


    <div class="voltar">
      Voltar para <a href="../inicio/inicio.html">Inicio</a>
    </div>


  </div>


</body>
